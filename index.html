<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi IPTV Personal</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    video { width: 100%; height: 240px; background: #000; }
    .controls { padding: 10px; display: flex; gap: 8px; }
    input[type="file"] { display: none; }
    .btn { background: #0084ff; color: #fff; padding: 10px 15px; border-radius: 6px; text-align: center; cursor: pointer; flex: 1; font-weight: bold; border: none; }
    .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
    .channel-item { padding: 12px; background: #1e1e1e; margin-bottom: 6px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .channel-item:active { background: #0084ff; }
  </style>
</head>
<body>

  <!-- Reproductor de Video -->
  <video id="video" controls autoplay playsinline></video>

  <!-- Botones de Carga -->
  <div class="controls">
    <label class="btn">
      Cargar M3U
      <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </label>
  </div>

  <!-- Lista de Canales -->
  <div class="channel-list" id="channelList">
    <p style="text-align: center; color: #888;">Carga tu lista M3U para empezar</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const fileInput = document.getElementById('fileInput');
    const channelList = document.getElementById('channelList');
    let hls = new Hls();

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => parseM3U(evt.target.result);
      reader.readAsText(file);
    });

    function parseM3U(content) {
      channelList.innerHTML = '';
      const lines = content.split('\n');
      let currentTitle = '';

      lines.forEach(line => {
        line = line.strip ? line.strip() : line.trim();
        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          currentTitle = parts[parts.length - 1] || 'Canal sin nombre';
        } else if (line && !line.startsWith('#')) {
          if (currentTitle) {
            addChannelItem(currentTitle, line);
            currentTitle = '';
          }
        }
      });
    }

    function addChannelItem(name, url) {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.textContent = name;
      item.onclick = () => playStream(url);
      channelList.appendChild(item);
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Soporte nativo para iOS Safari
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
