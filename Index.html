<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Argentina en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                TV Argentina <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">Vivo</span>
            </h1>
            <div class="w-full sm:w-auto flex gap-2">
                <input type="text" id="searchInput" placeholder="Buscar canal..." 
                    class="bg-slate-800 text-sm px-3 py-1.5 rounded border border-slate-700 focus:outline-none focus:border-red-500 w-full sm:w-64"
                    oninput="filterChannels()">
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto flex-1 w-full p-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Zona de Reproductor -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 flex items-center justify-center">
                <!-- Video HLS -->
                <video id="videoPlayer" controls autoplay class="w-full h-full object-contain"></video>
                
                <!-- Web View Iframe para eventos/deportes -->
                <iframe id="webPlayer" class="w-full h-full hidden border-0" allowfullscreen></iframe>
                
                <!-- Pantalla de carga -->
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center gap-2 transition-opacity duration-300">
                    <div class="w-8 h-8 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-slate-300" id="loadingText">Selecciona un canal...</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h2 id="currentChannelTitle" class="text-lg font-semibold text-white">Ningún canal seleccionado</h2>
                    <p id="currentChannelDesc" class="text-xs text-slate-400 mt-1">Haz clic en la lista para reproducir.</p>
                </div>
            </div>
        </div>

        <!-- Lista de Canales -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col gap-3 h-[600px] overflow-y-auto">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">Canales Confirmados</h3>
            <div id="channelList" class="flex flex-col gap-2"></div>
        </div>

    </main>

    <script>
        const channels = [
            { name: "Canal 26", chno: "24.2", type: "hls", url: "https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8" },
            { name: "+Perfil", chno: "25.6", type: "hls", url: "https://unlimited1-us.dps.live/perfiltv/perfiltv.smil/perfiltv/livestream2/chunks.m3u8" },
            { name: "Telemax", chno: "26.3", type: "hls", url: "https://stream-gtlc.telecentro.net.ar/hls/telemaxhls/main.m3u8" },
            { name: "Net TV", chno: "27.2", type: "hls", url: "https://unlimited1-us.dps.live/nettv/nettv.smil/playlist.m3u8" },
            { name: "TV Universidad", chno: "32.1", type: "hls", url: "https://stratus.stream.cespi.unlp.edu.ar/hls/tvunlp.m3u8" },
            { name: "El Trece", chno: "33.1", type: "hls", url: "https://livetrx01.vodgc.net/eltrecetv/index.m3u8" },
            { name: "Telefe", chno: "34.1", type: "hls", url: "http://45.134.141.161:2200/ARG/TELEFE_HD/index.m3u8" },
            { name: "América", chno: "36.1", type: "hls", url: "https://prepublish.f.qaotic.net/a07/americahls-100056/playlist_720p.m3u8" },
            { name: "⚽ Eventos Deportes (Web)", chno: "DEP", type: "web", url: "https://pelotalibre.la/eventos.html" }
        ];

        let hls = null;
        const video = document.getElementById('videoPlayer');
        const iframe = document.getElementById('webPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        function renderChannels(listToRender = channels) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            listToRender.forEach((ch) => {
                const originalIndex = channels.findIndex(c => c.name === ch.name);
                const btn = document.createElement('button');
                btn.className = `text-left p-3 rounded-lg border border-slate-800 ${ch.type === 'web' ? 'bg-green-950/40 border-green-800' : 'bg-slate-950/40'} hover:bg-slate-800 transition flex items-center justify-between group`;
                btn.innerHTML = `
                    <span class="font-medium text-sm text-white group-hover:text-red-400 truncate">${ch.name}</span>
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${ch.chno}</span>
                `;
                btn.onclick = () => playChannel(originalIndex);
                container.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        function playChannel(index) {
            const ch = channels[index];
            document.getElementById('currentChannelTitle').innerText = ch.name;
            document.getElementById('currentChannelDesc').innerText = `Señal en vivo`;
            
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (ch.type === 'web') {
                video.classList.add('hidden');
                iframe.classList.remove('hidden');
                iframe.src = ch.url;
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    loadingOverlay.style.pointerEvents = 'none';
                }, 1000);
            } else {
                iframe.classList.add('hidden');
                iframe.src = '';
                video.classList.remove('hidden');

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(ch.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay bloqueado:", e));
                        loadingOverlay.style.opacity = '0';
                        loadingOverlay.style.pointerEvents = 'none';
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = ch.url;
                    video.addEventListener('loadedmetadata', function() {
                        video.play();
                        loadingOverlay.style.opacity = '0';
                        loadingOverlay.style.pointerEvents = 'none';
                    });
                }
            }
        }

        window.onload = () => {
            renderChannels();
            playChannel(0);
        };
    </script>
</body>
</html>
